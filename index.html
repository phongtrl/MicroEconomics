<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mikroøkonomi – MBA Audio Academy</title>
  <link rel="stylesheet" href="player.css?v=3">
  <script src="chapters.js?v=56d9fa4" defer></script>
  <script src="captions.js?v=2" defer></script>
  <script src="player.js?v=3" defer></script>
</head>
<body>
  <main id="library-view" class="library-view">
    <div class="library-content">
      <header class="site-header">
        <span>MBA Audio Academy</span>
        <button id="theme" type="button" aria-pressed="false">Lys visning</button>
      </header>

      <section class="book" aria-labelledby="book-title">
        <div>
          <h1 id="book-title">Mikroøkonomi</h1>
          <p class="subtitle">Kunsten å ta bedre beslutninger</p>
          <p class="book-summary">Kapittel 1 på 39 min · 11 korte introduksjoner</p>
        </div>
        <a class="download-book" href="audio/Mikrookonomi.m4b?v=56d9fa4" download>Last ned lydsporene (M4B)</a>
      </section>

      <section aria-labelledby="library-title">
        <h2 id="library-title">Kapitler</h2>
        <ol id="chapters" class="tracks"></ol>
      </section>

      <section class="manuscript" aria-label="Manus og nedlasting for kapitlet">
        <details>
          <summary>Les manus for valgt kapittel</summary>
          <article id="script" aria-labelledby="chapter-title"></article>
        </details>
        <a id="chapter-download" download>Last ned valgt kapittel (MP3)</a>
      </section>
    </div>
  </main>

  <section class="player" aria-label="Avspilling">
    <div class="player-content">
      <div id="caption-panel" class="caption-panel">
        <p id="caption-context"></p>
        <p id="captions"></p>
      </div>
      <div class="timeline">
        <span id="elapsed" aria-hidden="true">0:00</span>
        <input id="seek" type="range" min="0" max="0" step="0.05" value="0" aria-label="Avspillingsposisjon" disabled>
        <span id="duration" aria-hidden="true">0:00</span>
      </div>
      <div class="player-toolbar">
        <div class="now-playing">
          <p id="chapter-title">Lytt til lydboken</p>
          <span id="chapter-number"></span>
        </div>
        <div class="transport">
          <button id="prev" type="button" aria-label="Forrige kapittel" title="Forrige kapittel"><span class="step-icon backward" aria-hidden="true"></span></button>
          <button id="play-pause" class="play" type="button" aria-label="Spill av" title="Spill av"><span class="play-icon" aria-hidden="true"></span></button>
          <button id="next" type="button" aria-label="Neste kapittel" title="Neste kapittel"><span class="step-icon" aria-hidden="true"></span></button>
        </div>
        <div class="options">
          <button id="caption-toggle" type="button" aria-pressed="true" aria-controls="caption-panel">Undertekster</button>
          <select id="rate" aria-label="Avspillingshastighet">
            <option value="0.75">0,75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1,25×</option>
            <option value="1.5">1,5×</option>
            <option value="2">2×</option>
          </select>
        </div>
      </div>
      <p id="status" role="status"></p>
    </div>
    <audio id="audio" preload="metadata" aria-labelledby="chapter-title" hidden></audio>
  </section>
</body>
</html>
